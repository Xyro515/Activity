<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="form-container">
    <h1>Student Registration</h1>
    <p>Join a school club and meet students with the same interests.</p>

    <form action="">
      <div class="form-group">
        <label for="full-name">Full Name</label>
        <input type="text" id="full-name" autocomplete="name" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="program">Program</label>
        <select id="program" required>
          <option value="">Select a program</option>
          <option value="bsit">BS Information Technology</option>
          <option value="bscs">BS Computer Science</option>
          <option value="bsis">BS Information Systems</option>
          <option value="bscpe">BS Computer Engineering</option>
        </select>
      </div>

      <div class="form-group">
        <label for="reason">Why do you want to join?</label>
        <input type="text" id="reason">
      </div>

      <button type="submit">Submit Registration</button>
    </form>
  </main> 
 <div class="copyright">
    <p>&copy; 2024 Student Registration. All rights reserved.</p>
  </div>
</body>
</html>
